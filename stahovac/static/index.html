<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sťahovač">
  <title>Sťahovač videí</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
          </span>
          <div>
            <h1>Sťahovač</h1>
            <p>Videá v pôvodnej kvalite</p>
          </div>
        </div>
      </header>

      <main class="screen" id="screen">
        <!-- Vstup -->
        <section class="card input-card">
          <label for="url" class="label">Odkaz na video</label>
          <div class="field">
            <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
                   spellcheck="false" placeholder="https://…">
            <button class="icon-btn" id="clear" type="button" aria-label="Vymazať" hidden>
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="platforms" id="platforms">
            <span class="chip" data-p="tiktok">TikTok</span>
            <span class="chip" data-p="instagram">Instagram</span>
            <span class="chip" data-p="youtube">YouTube</span>
            <span class="chip" data-p="facebook">Facebook</span>
          </div>
          <div class="actions">
            <button class="btn ghost" id="paste" type="button">
              <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg>
              Vložiť
            </button>
            <button class="btn primary" id="fetch" type="button">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              Nájsť video
            </button>
          </div>
        </section>

        <!-- Stav / chyba -->
        <div class="notice" id="notice" role="status" hidden></div>

        <!-- Načítavanie -->
        <section class="card skeleton" id="loading" hidden>
          <div class="sk-thumb"></div>
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
        </section>

        <!-- Výsledok -->
        <section class="card result" id="result" hidden>
          <div class="media">
            <img id="thumb" alt="" referrerpolicy="no-referrer">
            <span class="badge" id="platformBadge"></span>
            <span class="duration" id="duration"></span>
          </div>
          <div class="meta">
            <h2 id="title"></h2>
            <p id="uploader"></p>
            <p class="dims" id="dims"></p>
          </div>

          <h3 class="section-title">Vyberte kvalitu</h3>
          <div class="options" id="options" role="radiogroup"></div>

          <div class="progress" id="progress" hidden>
            <div class="progress-head">
              <span id="progressLabel">Pripravujem…</span>
              <span id="progressPct"></span>
            </div>
            <div class="bar"><span id="progressBar"></span></div>
            <p class="progress-sub" id="progressSub"></p>
          </div>

          <button class="btn primary big" id="download" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
            <span>Stiahnuť</span>
          </button>
          <button class="btn ghost big" id="cancel" type="button" hidden>Zrušiť</button>
        </section>

        <!-- História -->
        <section class="history" id="historyWrap" hidden>
          <div class="history-head">
            <h3 class="section-title">Nedávne</h3>
            <button class="link" id="clearHistory" type="button">Vymazať</button>
          </div>
          <ul id="history"></ul>
        </section>

        <p class="legal">Sťahujte len videá, ku ktorým máte práva, alebo na osobné použitie v súlade s podmienkami platformy.</p>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
