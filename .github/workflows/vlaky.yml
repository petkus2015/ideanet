name: Meškanie vlakov (každých 5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      # História KPI sa nedrží v gite — stiahne sa z poslednej nasadenej verzie.
      - name: Predošlá história
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/vlaky/data/history.json" -o vlaky/data/history.json || true

      - name: Stiahnuť dáta z ŽSR
        run: python3 scripts/fetch_zsr.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
